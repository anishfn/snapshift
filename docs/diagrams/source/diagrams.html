<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="module">
window.EXCALIDRAW_ASSET_PATH = "https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/prod/";
const ex = await import("https://esm.sh/@excalidraw/excalidraw@0.18.0?bundle-deps");

// The README's diagrams, drawn simply: a handful of boxes each, few words, big type.
// Three rules keep them clean:
// - Nothing is written on an arrow. A label sits above or below its arrow, centred, clear of the line.
// - The gap between two boxes is wider than the label that sits in it (checked below: a too-long label warns).
// - Words in a box are centred with room around them; a box is sized for its longest line.

// Excalidraw's own palette
const C = { ink: "#1e1e1e", grey: "#868e96", blue: "#a5d8ff", green: "#b2f2bb", yellow: "#ffec99", red: "#ffc9c9", violet: "#d0bfff", sand: "#ffd8a8", paper: "#f8f9fa", white: "#ffffff" };

const geo = {};
/** Text that should end up centred on an x: its real width is only known after Excalidraw measures it. */
const centred = new Map();
let n = 0;
const wide = (t, size) => Math.max(...t.split("\n").map((l) => l.length)) * size * 0.58;

const box = (id, x, y, w, h, text, bg = C.paper, size = 20) => {
  geo[id] = { x, y, w, h };
  if (text && wide(text, size) > w - 28) console.warn(`"${id}": text is wider than its box`);
  return {
    type: "rectangle", id, x, y, width: w, height: h, backgroundColor: bg, fillStyle: "solid", strokeColor: C.ink, strokeWidth: 2, roughness: 1, roundness: { type: 3 },
    ...(text && { label: { text, fontSize: size, textAlign: "center", verticalAlign: "middle", strokeColor: C.ink } }),
  };
};
const text = (x, y, t, size = 20, color = C.ink) => ({ type: "text", x, y, text: t, fontSize: size, strokeColor: color });
/** A line of words centred on `cx`. */
const note = (cx, y, t, size = 17, color = C.grey) => {
  const id = `note-${n++}`;
  centred.set(id, cx);
  return { type: "text", id, x: cx, y, text: t, fontSize: size, strokeColor: color, textAlign: "center" };
};
const title = (t, sub) => [text(40, 16, t, 32), ...(sub ? [text(40, 64, sub, 19, C.grey)] : [])];

/**
 * An arrow from one box's edge to another's, straight across or straight down, with its label beside it:
 * above the line (or below, for the second of a pair), never on it.
 */
const flow = (from, to, label, { dashed = false, both = false, side = "above", shift = 0 } = {}) => {
  const a = geo[from], b = geo[to];
  const across = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y) > 20;
  const style = { strokeColor: C.ink, strokeWidth: 2, roughness: 1, endArrowhead: "arrow", ...(both && { startArrowhead: "arrow" }), ...(dashed && { strokeStyle: "dashed" }) };
  if (across) {
    const right = b.x > a.x;
    const x1 = right ? a.x + a.w + 10 : a.x - 10;
    const x2 = right ? b.x - 10 : b.x + b.w + 10;
    const y = (Math.max(a.y, b.y) + Math.min(a.y + a.h, b.y + b.h)) / 2 + shift;
    if (label && wide(label, 17) > Math.abs(x2 - x1) - 16) console.warn(`"${label}" is wider than the gap between ${from} and ${to}`);
    return [
      { type: "arrow", x: x1, y, width: x2 - x1, height: 0, points: [[0, 0], [x2 - x1, 0]], ...style },
      ...(label ? [note((x1 + x2) / 2, side === "above" ? y - 17 * 1.25 * label.split("\n").length - 10 : y + 12, label, 17, C.ink)] : []),
    ];
  }
  const down = b.y > a.y;
  const y1 = down ? a.y + a.h + 10 : a.y - 10;
  const y2 = down ? b.y - 10 : b.y + b.h + 10;
  const x = (Math.max(a.x, b.x) + Math.min(a.x + a.w, b.x + b.w)) / 2 + shift;
  return [
    { type: "arrow", x, y: y1, width: 0, height: y2 - y1, points: [[0, 0], [0, y2 - y1]], ...style },
    ...(label ? [text(x + 16, (y1 + y2) / 2 - 12, label, 17, C.ink)] : []),
  ];
};

const diagrams = {
  /* 1. Who talks to whom ------------------------------------------------ */
  "big-picture": [
    ...title("The big picture", "Snap decides how the answer looks. A writer fills it in."),
    box("you", 40, 190, 260, 150, "Your browser\n\nthe chat", C.blue, 22),
    box("server", 560, 130, 280, 270, "The app's server\n\n1. asks Snap\n2. asks the writer\n3. sends it back", C.yellow, 20),
    box("snap", 1130, 130, 300, 115, "SubQ Snap\ndecides, in about 1 s", C.violet, 21),
    box("writer", 1130, 285, 300, 115, "The writer\nwrites the answer", C.green, 21),
    ...flow("you", "server", "your message + files", { shift: -22 }),
    ...flow("server", "you", "the answer, streamed", { dashed: true, side: "below", shift: 22 }),
    ...flow("server", "snap", "what should it look like?", { both: true }),
    ...flow("server", "writer", "fill it in", { both: true }),
  ],

  /* 2. One turn --------------------------------------------------------- */
  "one-turn": [
    ...title("One turn", "From pressing Enter to a finished answer."),
    box("t1", 40, 150, 290, 120, "1. You ask", C.blue, 22),
    box("t2", 420, 150, 290, 120, "2. Snap decides\nabout 1 second", C.violet, 22),
    box("t3", 800, 150, 290, 120, "3. The shape appears\na skeleton", C.yellow, 22),
    box("t4", 1180, 150, 290, 120, "4. The writer\nfills it in", C.green, 22),
    ...flow("t1", "t2"), ...flow("t2", "t3"), ...flow("t3", "t4"),
    note(185, 292, "any question,\nany files"),
    note(565, 292, "which component,\nwhich files"),
    note(945, 292, "before a single\nword is written"),
    note(1325, 292, "then you can\nuse it"),
  ],

  /* 3. The one Snap call ------------------------------------------------ */
  "snap-call": [
    ...title("What Snap answers, in one call", "It reads everything in the chat and answers typed questions. It never writes text."),
    box("reads", 40, 150, 330, 290, "Snap reads\n\nevery message\nevery file's text\nup to 4 images", C.blue, 21),
    box("snap", 500, 235, 230, 120, "SubQ Snap\none call", C.violet, 22),
    box("q1", 860, 130, 500, 68, "Which component? (1 of 29, up to 3)", C.white, 19),
    box("q2", 860, 213, 500, 68, "Which earlier message matters?", C.white, 19),
    box("q3", 860, 296, 500, 68, "Which files should come back?", C.white, 19),
    box("q4", 860, 379, 500, 68, "How long should it be?", C.white, 19),
    ...flow("reads", "snap"),
    ...flow("snap", "q2", "", { shift: 26 }),
    note(1110, 468, "Every answer comes with a probability."),
  ],

  /* 4. The screen ------------------------------------------------------- */
  "screen-map": [
    ...title("The screen"),
    box("frame", 40, 80, 1340, 500, "", C.white),
    box("side", 62, 102, 230, 456, "Sidebar\n\nyour chats\nthe two demos", C.blue, 20),
    box("line", 314, 102, 600, 62, "Snap · Chart · 96% · 0.9s", C.violet, 19),
    box("answer", 314, 180, 600, 218, "The answer\n\na chart, a map, a checklist ...\nor plain text", C.green, 20),
    box("composer", 314, 414, 600, 144, "Composer\n\nAttach: files, a GitHub repo, a web page", C.yellow, 19),
    box("panel", 936, 102, 422, 456, "Document panel\n\nopens when you click\na file or a PDF", C.sand, 20),
  ],

  /* 5. A component's life ----------------------------------------------- */
  "component-life": [
    ...title("A component's life"),
    box("c1", 40, 120, 290, 120, "Skeleton\nthe shape, waiting", C.yellow, 21),
    box("c2", 420, 120, 290, 120, "Filling in\nas the writer writes", C.violet, 21),
    box("c3", 800, 120, 290, 120, "Ready", C.green, 22),
    box("c4", 1180, 120, 290, 120, "You use it\nand it's saved", C.blue, 21),
    ...flow("c1", "c2"), ...flow("c2", "c3"), ...flow("c3", "c4"),
    box("c5", 420, 330, 290, 100, "Came back empty?\n\"Ask again\"", C.red, 20),
    ...flow("c2", "c5", "", { dashed: true }),
  ],

  /* 6. Long context ----------------------------------------------------- */
  "snap-recall": [
    ...title("Long context", "Snap reads all of it, every turn. Then it picks what matters."),
    box("chat", 40, 150, 360, 290, "In one chat\n\na 164-page PDF\na 111-file repository\nevery message so far", C.blue, 20),
    box("snap", 560, 220, 260, 150, "SubQ Snap\n\n171k tokens\nin 2 to 3.3 seconds", C.violet, 20),
    box("picks", 980, 150, 400, 290, "What it picks\n\nthe right component\nthe 1 message that matters\nthe 1 or 2 files needed", C.green, 20),
    ...flow("chat", "snap", "everything"),
    ...flow("snap", "picks", "decisions"),
    note(710, 470, "The writer then reads only those files, not all 171k tokens."),
  ],
};

window.__out = {};
for (const [name, skel] of Object.entries(diagrams)) {
  const elements = ex.convertToExcalidrawElements(skel, { regenerateIds: false });
  // now that each line has been measured, centre the ones that asked for it
  for (const el of elements) if (el.type === "text" && centred.has(el.id)) el.x = centred.get(el.id) - el.width / 2;
  const appState = { exportBackground: true, viewBackgroundColor: "#ffffff", exportPadding: 28 };
  const svg = await ex.exportToSvg({ elements, appState, files: null });
  window.__out[name] = { svg: svg.outerHTML, json: ex.serializeAsJSON(elements, { viewBackgroundColor: "#ffffff" }, {}, "local") };
}
window.__done = true;
</script></body></html>
